<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Assistente Acadêmico</title>
  <desc id="desc">Balão de conversa com um livro aberto, coberto por um capelo de formatura, com brilhos representando inteligência artificial.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#A5B4FC" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B0A2A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="240" r="220" fill="url(#glow)"/>

  <!-- Balão de conversa -->
  <path filter="url(#shadow)" fill="#FFFFFF"
        d="M144 176 H368 A48 48 0 0 1 416 224 V336 A48 48 0 0 1 368 384 H212 L156 432 V384 H144 A48 48 0 0 1 96 336 V224 A48 48 0 0 1 144 176 Z"/>

  <!-- Livro aberto -->
  <g stroke="#4338CA" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path fill="url(#page)" d="M256 262 C232 248 196 246 168 254 V342 C196 334 232 336 256 350 Z"/>
    <path fill="url(#page)" d="M256 262 C280 248 316 246 344 254 V342 C316 334 280 336 256 350 Z"/>
    <g fill="none" stroke="#A5B4FC" stroke-width="5">
      <path d="M186 278 C204 274 222 275 238 282"/>
      <path d="M186 300 C204 296 222 297 238 304"/>
      <path d="M186 322 C204 318 222 319 238 326"/>
      <path d="M274 282 C290 275 308 274 326 278"/>
      <path d="M274 304 C290 297 308 296 326 300"/>
      <path d="M274 326 C290 319 308 318 326 322"/>
    </g>
  </g>

  <!-- Capelo -->
  <g filter="url(#shadow)">
    <path fill="#1E293B" d="M196 172 V206 C196 230 316 230 316 206 V172 L256 196 Z"/>
    <path fill="url(#cap)" stroke="#475569" stroke-width="2" stroke-linejoin="round"
          d="M256 100 L372 148 L256 196 L140 148 Z"/>
  </g>

  <!-- Borla -->
  <g stroke="#F59E0B" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M256 148 L344 162"/>
    <path d="M344 162 V214"/>
  </g>
  <circle cx="256" cy="148" r="8" fill="#F59E0B"/>
  <path fill="#F59E0B" d="M336 212 H352 L356 240 H332 Z"/>

  <!-- Brilhos (IA) -->
  <g fill="#FDE68A">
    <path d="M404 70 Q404 96 430 96 Q404 96 404 122 Q404 96 378 96 Q404 96 404 70 Z"/>
    <path d="M446 128 Q446 142 460 142 Q446 142 446 156 Q446 142 432 142 Q446 142 446 128 Z"/>
    <path d="M100 96 Q100 110 114 110 Q100 110 100 124 Q100 110 86 110 Q100 110 100 96 Z" fill-opacity="0.8"/>
  </g>
</svg>